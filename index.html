<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HB Gewährleistung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: Arbeitswerkzeug mit fester Navigation links (mobil: Leiste oben), Inhalt als Akte mit Fakten rechts */
:root{
  --bg:#f2f3ee; --surface:#ffffff; --surface-2:#eaece4; --line:#d6dacd; --fg:#1d2218; --muted:#5d6555;
  --accent:#687451; --accent-ink:#ffffff; --accent-soft:#e3e8d9;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a8650f; --warn-soft:#f6e7cf; --crit:#b42318; --crit-soft:#f8dcd8; --info:#2a62a6; --info-soft:#dbe7f5;
  --font-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif; --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131611; --surface:#1b1f18; --surface-2:#242a20; --line:#343b2d; --fg:#e5e9de; --muted:#a2aa97;
  --accent:#a6b78b; --accent-ink:#131611; --accent-soft:#2c3524;
  --ok:#62c48f; --ok-soft:#1d3426; --warn:#e3aa55; --warn-soft:#3a2c17; --crit:#f08a7f; --crit-soft:#3d1f1b; --info:#80b2ea; --info-soft:#1c2c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131611; --surface:#1b1f18; --surface-2:#242a20; --line:#343b2d; --fg:#e5e9de; --muted:#a2aa97;
  --accent:#a6b78b; --accent-ink:#131611; --accent-soft:#2c3524;
  --ok:#62c48f; --ok-soft:#1d3426; --warn:#e3aa55; --warn-soft:#3a2c17; --crit:#f08a7f; --crit-soft:#3d1f1b; --info:#80b2ea; --info-soft:#1c2c40; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:14px}.brand span{font-size:12px;color:var(--muted)}
.obj{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.obj small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.obj b{font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--fg)}
.nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 10px 4px}
.count{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 7px;font-variant-numeric:tabular-nums}
.count.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.who label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=date],input[type=time],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.55}
main{padding-block:28px 60px;padding-inline:clamp(16px,3vw,36px);min-width:0}
.demo{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.demo .tag{border:1px dashed var(--line);border-radius:20px;padding:1px 9px}
h1{font-size:24px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:15px;margin:0}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph p{margin:4px 0 0;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.block{width:100%;justify-content:flex-start}
.btn small{color:inherit;opacity:.7;font-weight:400;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--accent)}
.kpi .n{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.alert .n{color:var(--crit)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel+.panel{margin-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.todo{display:flex;flex-direction:column}
.todo button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.todo button:first-child{border-top:0}
.todo button:hover b{text-decoration:underline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.crit{background:var(--crit)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}.dot.ok{background:var(--ok)}.dot.acc{background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.p-neu{background:var(--info-soft);color:var(--info)}
.p-pruefung{background:var(--warn-soft);color:var(--warn)}
.p-frist{background:var(--accent-soft);color:var(--fg)}
.p-einschreiben{background:var(--warn-soft);color:var(--warn)}
.p-termin{background:var(--info-soft);color:var(--info)}
.p-freigabe{background:var(--accent-soft);color:var(--fg)}
.p-bautraeger{background:var(--crit-soft);color:var(--crit)}
.p-abgelehnt{background:var(--surface-2);color:var(--muted)}
.p-geschlossen{background:var(--ok-soft);color:var(--ok)}
.prio{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--crit)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{cursor:pointer;display:grid;grid-template-columns:86px minmax(0,1.6fr) minmax(0,1fr) 150px 120px 34px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.head{cursor:default;background:var(--surface-2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-block:8px}
.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:12px;color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.av.NK{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.due{font-size:13px;font-variant-numeric:tabular-nums}
.due.crit{color:var(--crit);font-weight:600}.due.warn{color:var(--warn);font-weight:600}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:10px;display:inline-block}
.back:hover{color:var(--fg)}
.stepper{display:flex;gap:4px;margin:16px 0 18px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 96px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.step i{height:5px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.step.done i{background:var(--accent);border-color:var(--accent)}
.step.now i{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,var(--accent-soft) 6px 10px);border-color:var(--accent)}
.step.now{color:var(--fg);font-weight:600}
.step.skip i{background:transparent;border-style:dashed}
.ki{border:1px solid var(--accent);background:linear-gradient(var(--accent-soft),var(--surface) 70%)}
.ki-h{display:flex;align-items:center;gap:8px;font-weight:600}
.ki-badge{font-size:11px;font-family:var(--font-mono);border:1px solid var(--accent);border-radius:5px;padding:0 6px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:0;font-weight:500}
.conf{display:grid;grid-template-columns:minmax(0,1fr) 90px 38px;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent)}
.verdict{display:inline-flex;gap:6px;align-items:center;font-weight:600;padding:3px 10px;border-radius:6px;margin:10px 0 6px}
.v-ok{background:var(--ok-soft);color:var(--ok)}.v-warn{background:var(--warn-soft);color:var(--warn)}.v-mix{background:var(--info-soft);color:var(--info)}
.note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 14px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:8px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.msg.out{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg.sys{align-self:center;background:transparent;border-style:dashed;font-size:12.5px;color:var(--muted);max-width:100%}
.msg .meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.msg p{margin:0;white-space:pre-line}
.att{display:inline-flex;margin-top:6px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--surface)}
.empty{color:var(--muted);font-size:13px;padding:16px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.doc .img{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;font-size:11px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--bg) 10px 20px)}
.doc .img.pdf{background:var(--surface-2);font-family:var(--font-mono);font-weight:500;color:var(--fg)}
.doc .cap{font-size:11.5px;padding:6px 8px;display:flex;flex-direction:column}
.doc .cap span{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:12.5px}
.log li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log time{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:6px}
.actions .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.inbox{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.mail{all:unset;cursor:pointer;display:block;padding:12px 14px;border-top:1px solid var(--line)}
.mail:first-child{border-top:0}
.mail:hover{background:var(--surface-2)}
.mail[aria-current="true"]{background:var(--accent-soft)}
.mail b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .from{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mail .k{font-size:11.5px;margin-top:4px;color:var(--accent);font-weight:600}
.mailbody{white-space:pre-line;background:var(--surface-2);border-radius:8px;padding:12px;margin:12px 0}
.sugg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.week{margin-bottom:16px}
.week h3{margin-bottom:8px}
.drow{display:grid;grid-template-columns:110px 90px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.drow:first-of-type{border-top:0}
.drow:hover{background:var(--surface-2)}
.tl{position:relative;font-size:12px}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;padding:4px 0}
.tl-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.seg{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.75;border-radius:4px}
.seg.soon{background:var(--warn);opacity:.9}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit)}
.ticks{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;margin-top:4px}
.ticks div{position:relative;height:16px}
.ticks span{position:absolute;transform:translateX(-50%);font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:12px}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.member{display:flex;flex-direction:column;gap:8px}
.member .top{display:flex;gap:10px;align-items:center}
.state{font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.sched{display:grid;grid-template-columns:40px repeat(13,minmax(18px,1fr));gap:2px;font-size:10.5px;min-width:520px}
.sched .h{font-family:var(--font-mono);color:var(--muted);text-align:left}
.sched .d{color:var(--muted);font-weight:600}
.cell{height:22px;border-radius:3px;background:var(--surface-2)}
.cell.on{background:var(--accent)}
.cell.on.p2{background:var(--info)}
.cell.on.p3{background:var(--warn)}
.cell.now{outline:2px solid var(--crit);outline-offset:-2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw{all:unset;cursor:pointer;width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:18px}
.portals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.phone{max-width:380px;width:100%;margin:0 auto;border:1px solid var(--line);border-radius:28px;background:var(--surface);padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.phone .bar-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 8px 10px}
.pscreen{background:var(--bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pscreen .ptitle{font-weight:700;font-size:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.vsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.vsteps li{display:flex;gap:8px;align-items:flex-start}
.vsteps li .dot{margin-top:6px;flex:none}
.big{width:100%;justify-content:center;padding:11px;font-size:15px}
.upload{border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center;font-size:13px;color:var(--muted);display:block;cursor:pointer}
.upload input{display:none}
.caption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
dialog{border:0;padding:0;background:transparent;max-width:min(720px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(10,12,8,.5)}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 48px);overflow:auto}
.dlg .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dlg label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hint{font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;max-width:calc(100vw - 32px)}
.report{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.report div{background:var(--surface-2);border-radius:8px;padding:10px}
.report b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
@media (max-width:1100px){.grid-side{grid-template-columns:minmax(0,1fr)}.team{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .obj,.who label{display:none}
  .who{margin:0 0 0 auto;flex-direction:row}
  .who select{width:auto;padding:4px 8px;font-size:13px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .nav .sep{display:none}
  .grid2,.inbox,.portals{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}

function dueTxt(f){ if(!f) return '<span class="muted">—</span>'; const n=days(f); const cls = n<0?'crit':n<=2?'crit':n<=7?'warn':'';

function timeline(){
  const s=D('2026-04-01'), e=D('2031-10-01'), span=e-s, pos=d=>((D(d)-s)/span*100).toFixed(2);
  const rows=Object.values(TRADES).sort((a,b)=>D(a.ende)-D(b.ende));
  const now=((new Date('2026-11-18T12:00:00')-s)/span*100).toFixed(2);
  return `<div class="tl">${rows.map(t=>`<div class="tl-row"><span title="${t.firma}">${t.gewerk} <span class="muted">${t.vertrag}</span></span><div class="track"><div class="seg" style="left:${pos(t.abnahme)}%;width:${pos(t.ende)-pos(t.abnahme)}%"></div><div class="today" style="left:${now}%"></div></div></div>`).join('')}
  <div class="ticks"><span></span><div>${[2027,2028,2029,2030,2031].map(y=>`<span style="left:${pos(y+'-01-01')}%">${y}</span>`).join('')}</div></div></div>
  <p class="note">Rote Linie = heute. VOB/B-Gewerke enden nach 4 Jahren, BGB-Gewerke nach 5 Jahren. Warnungen 6, 3 und 1 Monat vor Ablauf.</p>`;
}

  if(kind==='ruege1'){const fr=fristIn(14);frist=fr;title='Stufe 1 · Mängelrüge';to=`${tr.firma} · ${tr.mail}`;via='E-Mail mit PDF';
    body=`Mängelanzeige · Bauvorhaben Quartier am Illerpark, Kempten\nVorgang ${t.id} · Vertrag nach ${tr.vertrag}\n\nSehr geehrte Damen und Herren,\n\nim Auftrag und in Vollmacht der Allgäu Wohnbau GmbH zeigen wir folgenden Mangel an Ihrer Leistung (${tr.gewerk}) an:\n\nOrt: ${t.einheit}\nBeschreibung: ${t.titel}\nGemeldet am: ${fmt(t.eingang)}\n\nWir fordern Sie auf, den Mangel bis zum ${fmt(fr.d)} zu beseitigen. Bitte schlagen Sie über den folgenden Link einen Termin vor: gewaehrleistung.hausblick-fn.de/f/${t.id}\n\nMit freundlichen Grüßen\n${VERM}`;
    hint=tr.vertrag==='VOB/B'?'VOB/B-Vertrag: Rüge zusätzlich als unterschriebenes PDF anhängen. Ohne Eingangsbestätigung der Firma nach 3 Tagen folgt automatisch der Hinweis auf Einschreiben.':'BGB-Vertrag: E-Mail ist formal ausreichend. Zugang über Lesebestätigung oder Antwort sichern.';}
  if(kind==='ruege2'){const fr=fristIn(13);frist=fr;title='Stufe 2 · Nachfrist mit Androhung der Ersatzvornahme';to=`${tr.firma} · Postanschrift`;via='Einwurf-Einschreiben über LetterXpress';
    body=`Nachfristsetzung · Vorgang ${t.id}\n\nSehr geehrte Damen und Herren,\n\nmit Schreiben vom ${t.log.find(l=>/Stufe 1/.test(l[2]))?.[0]||'—'} haben wir Sie zur Beseitigung des Mangels „${t.titel}“ (${t.einheit}) aufgefordert. Die Frist ist ohne Ergebnis abgelaufen.\n\nWir setzen Ihnen hiermit eine letzte Frist bis zum ${fmt(fr.d)}. Nach fruchtlosem Ablauf wird die Allgäu Wohnbau GmbH den Mangel durch ein anderes Unternehmen auf Ihre Kosten beseitigen lassen und die Kosten mit der vorhandenen Sicherheit (${tr.sich}) verrechnen.\n\nMit freundlichen Grüßen\n${VERM}`;
    hint='Frist enthält 3 Tage Postlaufzeit. Sendungsnummer und Zustellnachweis werden automatisch im Vorgang abgelegt.';
    extra=`<div class="row2"><label>Versandart<select id="lx"><option>Einwurf-Einschreiben</option><option>Einschreiben mit Rückschein</option><option>Einschreiben eigenhändig</option></select></label><label>Kopie per E-Mail<select id="lxm"><option>Ja, zusätzlich an ${tr.mail}</option><option>Nein</option></select></label></div>`;}
  if(kind==='stufe3'){title='Stufe 3 · Übergabe an Bauträger';to='Allgäu Wohnbau GmbH · Projektleitung';via='E-Mail mit Akte';

    hint=`Akte_${t.id}.pdf wird aus dem Protokoll erzeugt (${t.log.length+t.docs.length} Einträge, chronologisch).`;}
  if(kind==='ablehnung'){title='Ablehnung zur Freigabe an Bauträger';to='Allgäu Wohnbau GmbH';via='Freigabe-Link';
    body=`Entwurf an ${t.melder[0]}:\n\nGuten Tag,\n\nwir haben Ihre Meldung ${t.id} geprüft. Nach unserer Einschätzung handelt es sich nicht um einen Gewährleistungsmangel, sondern um ${t.gw==='T07'?'eine Wartungsfuge, die regelmäßig gereinigt und bei Bedarf erneuert werden muss':'ein übliches Erscheinungsbild in der ersten Zeit nach Fertigstellung'}.\n\nFolgende Hinweise helfen: …\n\nMit freundlichen Grüßen\n${VERM}`;

  if(kind==='freigabelink'){title='Freigabe-Link an Eigentümer';to=t.melder.join(', ');via='E-Mail mit Link';

  $('#dlg').showModal();
  $('#cform').onsubmit=e=>{e.preventDefault(); apply(kind,frist); $('#dlg').close();};
}
function apply(kind,frist){

  const add=(tab,m)=>t.conv[tab].push(Object.assign({d:'out',who:PEOPLE[state.me].name,at},m));
  const map={
    bestaetigung:()=>{add('eig',{via:'E-Mail',t:'Eingangsbestätigung versendet.'});t.log.push([at,who,'Eingangsbestätigung versendet']);if(t.stage<1){t.stage=1;t.st='pruefung'}state.tab='eig';toast('Eingangsbestätigung versendet und protokolliert')},
    rueckfrage:()=>{add('eig',{via:'E-Mail',t:'Rückfrage mit Upload-Link versendet.'});t.log.push([at,who,'Rückfrage an Eigentümer']);state.tab='eig';toast('Rückfrage versendet')},
    ruege1:()=>{add('gw',{via:'E-Mail · Stufe 1',t:`Mängelrüge mit Frist bis ${fmt(frist.d)}.`,a:`Mängelrüge_${t.id}.pdf`});t.frist=iso(frist.d);t.stage=2;t.st='frist';t.log.push([at,who,`Stufe 1: Mängelrüge, Frist ${fmt(frist.d)}`]);state.tab='gw';toast('Mängelrüge versendet · Frist im Kalender')},
    ruege2:()=>{add('gw',{via:'Einwurf-Einschreiben (LetterXpress)',t:`Nachfrist bis ${fmt(frist.d)} mit Androhung der Ersatzvornahme.`,a:`Nachfrist_${t.id}.pdf`});t.frist=iso(frist.d);t.stage=3;t.st='einschreiben';t.log.push([at,who,`Stufe 2: Einschreiben beauftragt, Frist ${fmt(frist.d)}`]);state.tab='gw';toast('An LetterXpress übergeben · Sendungsnummer folgt')},
    stufe3:()=>{add('bt',{via:'E-Mail',t:'Vorgang mit vollständiger Akte übergeben.',a:`Akte_${t.id}.pdf`});t.stage=4;t.st='bautraeger';t.frist=null;t.log.push([at,who,'Stufe 3: Akte an Bauträger übergeben']);state.tab='bt';toast('Akte erzeugt und an Bauträger gesendet')},
    ablehnung:()=>{add('bt',{via:'Freigabe-Link',t:'Ablehnung zur Freigabe vorgelegt.'});t.st='abgelehnt';t.log.push([at,who,'Ablehnung an Bauträger zur Freigabe']);state.tab='bt';toast('Zur Freigabe an Bauträger')},
    klaerung:()=>{add('bt',{via:'Klärungs-Link',t:'Bitte um technische Einschätzung.'});t.log.push([at,who,'Klärungsanfrage an Bauleitung']);state.tab='bt';toast('Klärungsanfrage gesendet')},
    freigabelink:()=>{add('eig',{via:'Freigabe-Link',t:'Freigabe-Link versendet.'});t.log.push([at,who,'Freigabe-Link an Eigentümer']);state.tab='eig';toast('Freigabe-Link versendet')},
    notiz:()=>{t.conv.int.push({d:'in',who:PEOPLE[state.me].name,at,via:'Telefonnotiz',t:$('#c-body').value});t.log.push([at,who,'Telefonnotiz erfasst']);state.tab='int';toast('Notiz gespeichert')}
  }; (map[kind]||(()=>toast('Gespeichert')))(); render();
}
function assignDlg(){ const t=T(state.id);
  $('#dlg').innerHTML=`<form class="dlg" id="aform"><h2 style="font-size:18px">Zuweisen · ${t.id}</h2>
  ${Object.entries(PEOPLE).map(([k,p])=>`<label style="flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--fg)"><input type="radio" name="p" value="${k}" ${t.bearb===k?'checked':''}> ${p.name} <span class="muted" style="font-size:12px">${k==='ED'?'· jetzt außerhalb Arbeitszeit, Benachrichtigung um 18:00':k==='LB'?'· verfügbar bis 16:00':'· verfügbar'}</span></label>`).join('')}
  <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="submit">Zuweisen</button></div></form>`;
  $('#dlg').showModal();
  $('#aform').onsubmit=e=>{e.preventDefault();const v=new FormData(e.target).get('p');t.bearb=v;t.log.push(['18.11. 14:30',PEOPLE[state.me].name.split(' ')[0],'Zugewiesen an '+PEOPLE[v].name]);$('#dlg').close();toast('Zugewiesen an '+PEOPLE[v].name);render();};
}
function reportDlg(){ const o=open();
  $('#dlg').innerHTML=`<div class="dlg"><div class="mono muted" style="font-size:12px">Entwurf · Monatsreport November 2026</div><h2 style="font-size:18px">Gewährleistung Quartier am Illerpark</h2>
  <div class="report"><div><b>${TICKETS.length}</b>Vorgänge gesamt</div><div><b>${o.length}</b>offen</div><div><b>1</b>abgeschlossen</div><div><b>2</b>Einschreiben</div><div><b>1</b>beim Bauträger</div><div><b>3,4 T.</b>Ø Reaktion Firmen</div></div>
  <div class="hint">Auffällig: Torsysteme Allgäu (Ø 9,5 Tage) und Wärme & Luft Riedle (zwei Fristen verstrichen). Empfehlung: Gespräch mit beiden Firmen.</div>
  <div class="hint">Zeitaufwand HB im November: 31,5 Std. (Niko 18,0 · Emre 13,5). Grundlage für die Neuverhandlung der Pauschale.</div>
  <div class="foot"><button class="btn" type="button" data-close>Schließen</button><button class="btn primary" type="button" data-close data-toast="Report als PDF an Bauträger gesendet">Als PDF senden</button></div></div>`;
  $('#dlg').showModal();
}

/* ---------- Render & Events ---------- */
function render(){ nav(); const v={dash:vDash,vorgaenge:vList,ticket:vTicket,eingang:vInbox,fristen:vDeadlines,gewerke:vTrades,team:vTeam,portale:vPortals}[state.view]; $('#main').innerHTML=v(); }
function go(v){ state.view=v; render(); window.scrollTo({top:0}); }
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const o=e.target.closest('[data-open]'); if(o){ state.id=o.dataset.open; state.tab='eig'; const t=T(state.id); if(!t.conv.eig.length) state.tab='gw'; go('ticket'); return; }
  const f=e.target.closest('[data-filter]'); if(f){ state.filter=f.dataset.filter; go('vorgaenge'); return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ state.tab=tb.dataset.tab; render(); return; }
  const m=e.target.closest('[data-mail]'); if(m){ state.mail=m.dataset.mail; render(); return; }
  const sw=e.target.closest('[data-sw]'); if(sw){ state.toggles[sw.dataset.sw]=!state.toggles[sw.dataset.sw]; render(); return; }
  const ow=e.target.closest('[data-own]'); if(ow){ state.ownerStep=+ow.dataset.own; render(); return; }
  const tr=e.target.closest('[data-tr]'); if(tr){ state.tradeStep=+tr.dataset.tr; render(); return; }
  const c=e.target.closest('[data-close]'); if(c){ $('#dlg').close(); if(c.dataset.toast) toast(c.dataset.toast); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const k=a.dataset.act;
  if(['bestaetigung','rueckfrage','ruege1','ruege2','stufe3','ablehnung','klaerung','freigabelink','notiz'].includes(k)) return compose(k);
  if(k==='zuweisen') return assignDlg();
  if(k==='report') return reportDlg();
  if(k==='schliessen'){ const t=T(state.id); t.st='geschlossen'; t.stage=7; t.frist=null; t.log.push(['18.11. 14:40',PEOPLE[state.me].name.split(' ')[0],'Vorgang abgeschlossen']); toast('Vorgang abgeschlossen'); return render(); }
  const msg={assignmail:'Mail dem Vorgang zugeordnet · Termin übernommen',split:'2 Vorgänge angelegt: GW-0024 und GW-0025',newfrommail:'Vorgang GW-0024 angelegt · KI-Einordnung läuft',newcase:'Formular für neuen Vorgang (im Prototyp nicht ausgebaut)',ical:'Kalender-Link kopiert (Prototyp)',abwesenheit:'Abwesenheit eintragen (im Prototyp nicht ausgebaut)'}[k];
  if(['assignmail','split','newfrommail'].includes(k)){ MAILS.splice(MAILS.findIndex(x=>x.id===state.mail),1); state.mail=MAILS[0]?.id; }
  toast(msg||'Erledigt'); render();
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const r=e.target.closest('.row[data-open]'); if(r) r.click(); }});
$('#role').addEventListener('change',e=>{ state.me=e.target.value; render(); toast('Ansicht als '+PEOPLE[state.me].name); });
document.addEventListener('change',e=>{ if(e.target.type==='file' && e.target.files.length) toast(e.target.files.length+' Datei(en) ausgewählt'); });
render();
</script>
</body>
</html>
